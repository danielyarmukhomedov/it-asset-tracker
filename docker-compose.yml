services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://app_user:StrongPass_2026!@172.17.0.1:5432/asset_tracker"
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://app_user:StrongPass_2026!@172.17.0.1:5432/asset_tracker?sslmode=disable"
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=StrongPass_2026!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://app_user:${DB_PASSWORD}@172.17.0.1:5432/asset_tracker"
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
